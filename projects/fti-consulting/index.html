<body class="project-page" data-project-id="fti-consulting">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header is-scrolled" data-header>
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Tomislav Martinez, home">
        <span class="brand-full">Tomislav Martinez</span>
        <span class="brand-short" aria-hidden="true">TM</span>
      </a>

      <nav class="site-nav project-nav" aria-label="Project navigation">
        <a href="index.html#work" data-i18n="nav.work">Work</a>
        <a href="index.html#photography" data-i18n="nav.photography">Photography</a>
        <a href="index.html#about" data-i18n="nav.about">About</a>
        <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="utility-button" type="button" data-language-toggle aria-label="Switch language">
          <span data-current-language>EN</span>
        </button>
        <button class="utility-button theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" data-project-root>
    <section class="project-hero section">
      <div class="container">
        <div class="project-kicker reveal">
          <a class="text-link project-back" href="index.html#work">
            <span aria-hidden="true">←</span>
            <span data-i18n="project.back">Back to work</span>
          </a>
          <span data-project-year></span>
        </div>

        <div class="project-title-row reveal">
          <div>
            <p class="eyebrow" data-project-category></p>
            <h1 data-project-title></h1>
          </div>
          <div class="project-intro-stack">
            <p class="project-intro" data-project-intro></p>
            <a class="text-link project-live-link" data-project-live-hero href="#" target="_blank" rel="noopener noreferrer" hidden>
              <span data-i18n="project.visit">Visit website</span>
              <span aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="project-cover-wrap">
      <div class="container">
        <figure class="project-cover reveal">
          <img data-project-cover src="" alt="">
        </figure>
      </div>
    </section>

    <section class="project-overview section">
      <div class="container project-overview-grid reveal">
        <p class="eyebrow" data-i18n="project.overview">Overview</p>
        <div class="project-overview-copy">
          <p class="project-lead" data-project-summary></p>
          <dl class="project-facts">
            <div><dt data-i18n="project.client">Client</dt><dd data-project-client></dd></div>
            <div><dt data-i18n="project.role">Role</dt><dd data-project-role></dd></div>
            <div><dt data-i18n="project.services">Services</dt><dd data-project-services></dd></div>
          </dl>
        </div>
      </div>
    </section>

    <section class="project-story section">
      <div class="container story-grid">
        <article class="story-block reveal">
          <p class="eyebrow" data-i18n="project.challenge">Challenge</p>
          <p data-project-problem></p>
        </article>
        <article class="story-block reveal">
          <p class="eyebrow" data-i18n="project.solution">Solution</p>
          <p data-project-solution></p>
        </article>
      </div>
    </section>

    <section class="project-gallery section">
      <div class="container gallery-grid" data-project-gallery></div>
    </section>

    <section class="project-live-site section" data-project-live-section hidden>
      <div class="container">
        <div class="live-site-panel reveal">
          <div>
            <p class="eyebrow" data-i18n="project.live">Live website</p>
            <h2 data-i18n="project.liveCopy">See the complete experience online.</h2>
          </div>
          <a class="text-link live-site-cta" data-project-live-footer href="#" target="_blank" rel="noopener noreferrer">
            <span data-i18n="project.visit">Visit website</span>
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </div>
    </section>

    <section class="related-projects section">
      <div class="container">
        <div class="section-heading reveal">
          <div>
            <p class="eyebrow" data-i18n="project.next">Continue exploring</p>
            <h2 data-i18n="project.related">Related projects</h2>
          </div>
        </div>
        <div class="related-grid" data-related-projects></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span data-current-year></span> Tomislav Martinez</p>
      <a href="index.html#work" class="text-link">
        <span data-i18n="project.all">All work</span>
        <span aria-hidden="true">↗</span>
      </a>
    </div>
  </footer>
  <dialog class="lightbox" data-lightbox aria-label="Project image viewer">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close image">×</button>
    <div class="lightbox-stage">
      <button class="lightbox-nav lightbox-previous" type="button" data-lightbox-previous aria-label="Previous image">←</button>
      <figure class="lightbox-figure">
        <img src="" alt="" data-lightbox-image>
        <figcaption data-lightbox-caption></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-next" type="button" data-lightbox-next aria-label="Next image">→</button>
    </div>
    <p class="lightbox-counter" data-lightbox-counter aria-live="polite"></p>
  </dialog>
</body>
</html>
